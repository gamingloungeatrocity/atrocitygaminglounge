name: Render Backend Keep Alive

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

concurrency:
  group: render-backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render Backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret is missing"
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "$BACKEND_URL/api/health"

          echo "Backend health check completed."
